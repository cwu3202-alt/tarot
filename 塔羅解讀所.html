function CardFace({ card, reversed, label, revealed, onClick }) {
  return (
    <div
      className={`card-slot face ${revealed ? "revealed" : ""} ${reversed ? "is-reversed" : ""}`}
      onClick={onClick}
      role="button"
      tabIndex={0}
      onKeyDown={(e) => {
        if (e.key === "Enter" || e.key === " ") onClick();
      }}
    >
      <div className="face-inner">
        <div className="face-top">
          {card.arcana === "major" ? (
            <span className="face-num">{String(card.num).padStart(2, "0")}</span>
          ) : (
            <span className="face-num">{card.rank}</span>
          )}
        </div>
        <div className="face-glyph">
          {card.arcana === "major" ? (
            <MajorGlyph color="#c9a961" />
          ) : (
            <SuitGlyph suitKey={card.suitKey} color={card.color} />
          )}
        </div>
        <div className="face-name">{card.name}</div>
        {reversed && <div className="rev-badge">逆位</div>}
      </div>
      <div className="slot-caption">
        <span className="slot-label">{label}</span>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   選牌 Modal
--------------------------------------------------------- */
function PickerModal({ onClose, onConfirm }) {
  const [tab, setTab] = useState("major");
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(null);
  const [reversed, setReversed] = useState(false);

  const tabs = [
    { key: "major", label: "大阿爾克那" },
    ...SUITS.map((s) => ({ key: s.key, label: s.name })),
  ];

  const pool = useMemo(() => {
    let list = tab === "major" ? MAJOR : MINOR.filter((c) => c.suitKey === tab);
    if (query.trim()) {
      list = list.filter((c) => c.name.includes(query.trim()));
    }
    return list;
  }, [tab, query]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>輸入你抽到的牌</h3>
          <button className="icon-btn" onClick={onClose} aria-label="關閉" type="button">
            ✕
          </button>
        </div>

        <input
          className="search-input"
          placeholder="搜尋牌名，例如：戀人、聖杯三"
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />

        <div className="tab-row">
          {tabs.map((t) => (
            <button
              key={t.key}
              type="button"
              className={`tab-btn ${tab === t.key ? "active" : ""}`}
              onClick={() => setTab(t.key)}
            >
              {t.label}
            </button>
          ))}
        </div>

        <div className="pool-grid">
          {pool.map((c) => (
            <button
              key={c.id}
              type="button"
              className={`pool-item ${selected?.id === c.id ? "selected" : ""}`}
              onClick={() => setSelected(c)}
            >
              {c.name}
            </button>
          ))}
          {pool.length === 0 && <div className="empty-hint">找不到符合的牌名</div>}
        </div>

        <div className="orient-row">
          <span className="orient-label">牌的方向</span>
          <div className="orient-toggle">
            <button
              type="button"
              className={!reversed ? "active" : ""}
              onClick={() => setReversed(false)}
            >
              正位
            </button>
            <button
              type="button"
              className={reversed ? "active" : ""}
              onClick={() => setReversed(true)}
            >
              逆位
            </button>
          </div>
        </div>

        <button
          type="button"
          className="confirm-btn"
          disabled={!selected}
          onClick={() => selected && onConfirm(selected, reversed)}
        >
          確認這張牌
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   解讀文字生成
--------------------------------------------------------- */
function buildReading(question, draws) {
  const lines = POSITIONS.map((pos, i) => {
    const d = draws[i];
    const meaning = d.reversed ? d.card.rev : d.card.up;
    const tag = d.reversed ? "（逆位）" : "（正位）";
    let sentence;
    if (pos.key === "past") {
      sentence = `回顧過去，${d.card.name}${tag}浮現，指向「${meaning}」。這是形塑你目前處境的重要背景，也是你此刻感受的起點。`;
    } else if (pos.key === "present") {
      sentence = `此刻，你正處在${d.card.name}${tag}的能量之中：「${meaning}」。這正是你眼下最需要正視的課題。`;
    } else {
      sentence = `若順著目前的方向走下去，${d.card.name}${tag}所指向的「${meaning}」，可能是接下來會迎向的走勢——塔羅指出的是趨勢，最終的選擇仍在你手中。`;
    }
    return { ...pos, card: d.card, reversed: d.reversed, meaning, sentence };
  });

  const majors = draws.filter((d) => d.card.arcana === "major").length;
  const reversedCount = draws.filter((d) => d.reversed).length;
  const suitCounts = {};
  draws.forEach((d) => {
    if (d.card.arcana === "minor") {
      suitCounts[d.card.suitKey] = (suitCounts[d.card.suitKey] || 0) + 1;
    }
  });
  const dominantSuit = Object.entries(suitCounts).sort((a, b) => b[1] - a[1])[0];
  const dominantSuitObj = dominantSuit ? SUITS.find((s) => s.key === dominantSuit[0]) : null;

  let synthesis = `針對你的提問「${question || "這件事"}」，這次的三張牌`;
  if (majors >= 2) {
    synthesis += `出現了${majors}張大阿爾克那，代表這件事對你來說份量不輕，牽動的是人生層次的課題，而不只是日常的小事。`;
  } else if (majors === 1) {
    synthesis += `出現了一張大阿爾克那，說明其中有一個關鍵轉折點，值得你特別留意。`;
  } else {
    synthesis += `全部由小阿爾克那組成，反映的多是日常、具體、可以馬上著手調整的細節。`;
  }

  if (dominantSuitObj && dominantSuit[1] >= 2) {
    synthesis += `同時，${dominantSuitObj.name}（${dominantSuitObj.element}元素・${dominantSuitObj.theme}）的能量特別集中，這件事的核心很可能落在「${dominantSuitObj.theme}」上。`;
  }

  if (reversedCount === 0) {
    synthesis += `三張牌都是正位，能量表現得直接、外顯，事情大致會依你能感受到的方向發展。`;
  } else if (reversedCount === 3) {
    synthesis += `三張牌全數逆位，提醒你有些狀況可能被壓抑、延遲或尚未浮上檯面，值得多向內探問，而不急著往外行動。`;
  } else {
    synthesis += `其中有${reversedCount}張逆位，代表部分能量還在醞釀、卡關或需要被重新調整，別忽略牌陣裡這些比較安靜的訊號。`;
  }

  return { lines, synthesis };
}

/* ---------------------------------------------------------
   主應用程式
--------------------------------------------------------- */
function TarotReader() {
  const [question, setQuestion] = useState("");
  const [draws, setDraws] = useState([null, null, null]);
  const [pickerIndex, setPickerIndex] = useState(null);
  const [revealed, setRevealed] = useState(false);

  const allFilled = draws.every(Boolean);
  const reading = useMemo(
    () => (allFilled && revealed ? buildReading(question, draws) : null),
    [allFilled, revealed, question, draws]
  );

  function handleConfirm(card, reversed) {
    const next = [...draws];
    next[pickerIndex] = { card, reversed };
    setDraws(next);
    setPickerIndex(null);
    setRevealed(false);
  }

  function randomizeAll() {
    const shuffled = [...DECK].sort(() => Math.random() - 0.5);
    const next = shuffled.slice(0, 3).map((card) => ({
      card,
      reversed: Math.random() < 0.35,
    }));
    setDraws(next);
    setRevealed(false);
  }

  function resetAll() {
    setDraws([null, null, null]);
    setRevealed(false);
    setQuestion("");
  }

  return (
    <div className="tarot-app">
      <div className="wrap">
        <div className="eyebrow">T A R O T &nbsp; R E A D I N G</div>
        <h1 className="title">塔羅解讀所</h1>
        <p className="subtitle">寫下你的提問，抽三張牌，讓過去、現在、未來給你一點方向</p>

        <div className="panel">
          <h2>第一步・你的提問</h2>
          <p className="desc">越具體的問題，牌面的回應也會越清晰。</p>
          <textarea
            className="question-input"
            placeholder="例如：我目前這段感情接下來會如何發展？"
            value={question}
            onChange={(e) => setQuestion(e.target.value)}
          />
        </div>

        <div className="panel">
          <h2>入門牌陣・過去・現在・未來</h2>
          <p className="desc">
            這是最經典的三張牌陣：先看事情從哪裡來、再看現在的處境，最後看下去的走向。
            實體抽牌後，點卡背輸入你抽到的牌與正逆位；若手邊沒有牌，也可以按「隨機抽三張」。
          </p>

          <div className="spread-row">
            {POSITIONS.map((pos, i) => {
              const d = draws[i];
              return d ? (
                <CardFace
                  key={pos.key}
                  card={d.card}
                  reversed={d.reversed}
                  label={pos.label}
                  revealed={revealed}
                  onClick={() => setPickerIndex(i)}
                />
              ) : (
                <CardBack
                  key={pos.key}
                  label={pos.label}
                  hint={pos.hint}
                  onClick={() => setPickerIndex(i)}
                />
              );
            })}
          </div>

          <div className="action-row">
            <button type="button" className="ghost-btn" onClick={randomizeAll}>
              隨機抽三張
            </button>
            <button
              type="button"
              className="gold-btn"
              disabled={!allFilled}
              onClick={() => setRevealed(true)}
            >
              為我解讀
            </button>
            <button type="button" className="ghost-btn" onClick={resetAll}>
              重新開始
            </button>
          </div>

          {allFilled && !revealed && (
            <p className="desc" style={{ textAlign: "center", marginTop: 14 }}>
              三張牌都已輸入，按「為我解讀」查看分析。若要更換某張牌，直接點擊那張牌重新選擇。
            </p>
          )}

          {reading && (
            <div className="reading-block">
              {reading.lines.map((l) => (
                <div className="reading-item" key={l.key}>
                  <span className="rlabel">
                    {l.label} · {l.card.name}
                    {l.reversed ? "（逆位）" : "（正位）"}
                  </span>
                  <p>{l.sentence}</p>
                </div>
              ))}
              <div className="synthesis">
                <span className="rlabel">整體指引</span>
                <p style={{ margin: "6px 0 0" }}>{reading.synthesis}</p>
              </div>
            </div>
          )}
        </div>
      </div>

      {pickerIndex !== null && (
        <PickerModal onClose={() => setPickerIndex(null)} onConfirm={handleConfirm} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TarotReader />);
